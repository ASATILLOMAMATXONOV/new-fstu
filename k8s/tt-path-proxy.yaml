apiVersion: v1
kind: Namespace
metadata:
  name: fstu-web
---
apiVersion: v1
kind: Service
metadata:
  name: tt-upstream
  namespace: fstu-web
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# TT_UPSTREAM_IP va TT_UPSTREAM_PORT qiymatlari deploydan oldin
# haqiqiy server manzili va portiga almashtiriladi.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: tt-upstream
  namespace: fstu-web
  labels:
    kubernetes.io/service-name: tt-upstream
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: TT_UPSTREAM_PORT
endpoints:
  - addresses:
      - TT_UPSTREAM_IP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fstu-tt-path
  namespace: fstu-web
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: fstu.uz
      http:
        paths:
          - path: /tt(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tt-upstream
                port:
                  number: 80
