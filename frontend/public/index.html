<!DOCTYPE html>
<html lang="uz">
  <head>
    <!-- =========================
         BASIC META
    ========================== -->
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#062b63" />

    <meta
      name="color-scheme"
      content="light"
    />

    <!-- =========================
         PRIMARY SEO
    ========================== -->
    <title>
      Farg‘ona Davlat Texnika Universiteti | FSTU
    </title>

    <meta
      name="description"
      content="Farg‘ona Davlat Texnika Universiteti (FSTU) rasmiy veb-sayti. Universitet yangiliklari, ta’lim yo‘nalishlari, qabul, ilmiy faoliyat, xalqaro hamkorlik va talabalar uchun ma’lumotlar."
    />

    <meta
      name="keywords"
      content="FSTU, Farg‘ona Davlat Texnika Universiteti, Fargona davlat texnika universiteti, Fergana State Technical University, universitet, oliy ta’lim, qabul, magistratura, bakalavriat, Farg‘ona universiteti, texnika universiteti"
    />

    <meta name="author" content="Farg‘ona Davlat Texnika Universiteti" />

    <meta name="publisher" content="Farg‘ona Davlat Texnika Universiteti" />

    <meta name="application-name" content="FSTU" />

    <meta name="robots" content="index, follow" />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- =========================
         CANONICAL
         
         Domenni real domeningizga
         almashtiring.
    ========================== -->
    <link
      rel="canonical"
      href="https://fstu.uz/"
    />

    <!-- =========================
         LANGUAGE / HREFLANG

         Agar sayt ko‘p tilli bo‘lsa
         ishlating.
    ========================== -->
    <link
      rel="alternate"
      hreflang="uz"
      href="https://fstu.uz/"
    />

    <link
      rel="alternate"
      hreflang="ru"
      href="https://fstu.uz/ru/"
    />

    <link
      rel="alternate"
      hreflang="en"
      href="https://fstu.uz/en/"
    />

    <link
      rel="alternate"
      hreflang="x-default"
      href="https://fstu.uz/"
    />

    <!-- =========================
         FAVICON
    ========================== -->
    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/logo.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/logo192.png"
    />

    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- =========================
         OPEN GRAPH
         Facebook / Telegram /
         LinkedIn
    ========================== -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Farg‘ona Davlat Texnika Universiteti"
    />

    <meta
      property="og:title"
      content="Farg‘ona Davlat Texnika Universiteti | FSTU"
    />

    <meta
      property="og:description"
      content="Farg‘ona Davlat Texnika Universitetining rasmiy veb-sayti. Ta’lim, qabul, ilmiy faoliyat, xalqaro hamkorlik va universitet yangiliklari."
    />

    <meta
      property="og:url"
      content="https://fstu.uz/"
    />

    <meta
      property="og:image"
      content="https://fstu.uz/og-image.jpg"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Farg‘ona Davlat Texnika Universiteti"
    />

    <meta
      property="og:locale"
      content="uz_UZ"
    />

    <!-- =========================
         TWITTER / X
    ========================== -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Farg‘ona Davlat Texnika Universiteti | FSTU"
    />

    <meta
      name="twitter:description"
      content="FSTU rasmiy veb-sayti: ta’lim, qabul, ilmiy faoliyat, xalqaro hamkorlik va universitet yangiliklari."
    />

    <meta
      name="twitter:image"
      content="https://fstu.uz/og-image.jpg"
    />

    <!-- =========================
         PERFORMANCE
    ========================== -->

    <!-- Main hero image -->
    <link
      rel="preload"
      as="image"
      href="%PUBLIC_URL%/hero-1-desktop.jpg"
      imagesrcset="
        %PUBLIC_URL%/hero-1-mobile.jpg 768w,
        %PUBLIC_URL%/hero-1-desktop.jpg 1360w
      "
      imagesizes="100vw"
      fetchpriority="high"
    />

    <!-- =========================
         STRUCTURED DATA
         Google Organization
    ========================== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollegeOrUniversity",
        "name": "Farg‘ona Davlat Texnika Universiteti",
        "alternateName": "FSTU",
        "url": "https://fstu.uz/",
        "logo": "https://fstu.uz/logo.png",
        "description": "Farg‘ona Davlat Texnika Universiteti rasmiy veb-sayti.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Farg‘ona",
          "addressCountry": "UZ"
        }
      }
    </script>
  </head>

  <body>
    <noscript>
      Ushbu veb-saytdan to‘liq foydalanish uchun JavaScript yoqilgan bo‘lishi kerak.
    </noscript>

    <div id="root"></div>
  </body>
</html>
