    <!-- Home page: request hero banners and preload the first banner image
         before the app bundle downloads (it is the LCP element). -->
    <script>
      (function () {
        if (location.pathname !== '/' || !window.fetch || !window.matchMedia) return;
        var configured = '%REACT_APP_API_URL%'.split(',')[0].trim();
        if (configured.charAt(configured.length - 1) === '/') configured = configured.slice(0, -1);
        var host = location.hostname;
        var api = configured || (host === 'new.fstu.uz' || host === 'www.new.fstu.uz' ? 'https://api.new.fstu.uz' : '');
        if (!api) return;
        var url = api + '/api/content/banners?activeOnly=true&imageMode=separate&summaryOnly=true';
        var widths = [320, 480, 640, 768, 960, 1280, 1600, 1920];
        var withWidth = function (src, width) { return src + (src.indexOf('?') >= 0 ? '&' : '?') + 'w=' + width; };
        var srcset = function (src) {
          var path = src.split('?')[0];
          var optimizable = path.indexOf('/api/media/images/') >= 0 ||
            (path.indexOf('/api/content/') >= 0 && (path.slice(-6) === '/image' || path.slice(-6) === '/asset')) ||
            (path.indexOf('/api/settings/') >= 0 && path.slice(-6) === '/asset');
          if (!optimizable) return '';
          return widths.map(function (w) { return withWidth(src, w) + ' ' + w + 'w'; }).join(', ');
        };
        var preload = function (src, media) {
          var set = srcset(src);
          if (!set) return;
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.setAttribute('imagesrcset', set);
          link.setAttribute('imagesizes', '100vw');
          link.setAttribute('fetchpriority', 'high');
          link.media = media;
          document.head.appendChild(link);
        };
        var request = fetch(url, { cache: 'no-store' });
        window.__FSTU_PREFETCH__ = window.__FSTU_PREFETCH__ || {};
        window.__FSTU_PREFETCH__[url] = request;
        request.then(function (response) {
          if (!response.ok) return;
          response.clone().json().then(function (data) {
            var slides = ((data && data.items) || []).filter(function (item) {
              return item && item.active !== false && item.image;
            }).sort(function (a, b) { return (Number(a.order) || 0) - (Number(b.order) || 0); });
            if (!slides.length) return;
            var desktop = slides[0].image.indexOf('/api/') === 0 ? api + slides[0].image : slides[0].image;
            var mobile = slides[0].mobileImage || desktop;
            preload(mobile, '(max-width: 640px)');
            preload(desktop, '(min-width: 641px)');
          }).catch(function () {});
        }).catch(function () {});
      })();
    </script>
